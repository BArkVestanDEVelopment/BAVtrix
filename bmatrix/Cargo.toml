[package]
name = "bavtrix"
version = "1.0.0"
edition = "2021"
authors = ["BArkVestan_Development"]
description = "BAVtrix: digital rain for the Windows desktop (high-DPI, multi-monitor)"
license-file = "../LICENSE"
publish = false

[build-dependencies]
embed-resource = "2.5"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

name: BAVtrix
options:
  bundleIdPrefix: dev.barkvestan
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
packages:
  BAVtrixCore:
    path: BAVtrixCore
targets:
  BAVtrix-iOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: ../legal/THIRD_PARTY_NOTICES.txt
    dependencies:
      - package: BAVtrixCore
    settings:
      base:
        PRODUCT_NAME: BAVtrix
        PRODUCT_BUNDLE_IDENTIFIER: dev.barkvestan.bavtrix
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BAVtrix
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  BAVtrix-macOS:
    type: application
    platform: macOS
    sources:
      - path: macOS
        excludes:
          - "Saver/**"
          - "SaverTool/**"
    dependencies:
      - package: BAVtrixCore
    settings:
      base:
        PRODUCT_NAME: BAVtrix
        PRODUCT_BUNDLE_IDENTIFIER: dev.barkvestan.bavtrix.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BAVtrix
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "BArkVestan_Development"
        CODE_SIGNING_ALLOWED: NO
        ENABLE_HARDENED_RUNTIME: NO

  BAVtrix-Saver:
    type: bundle
    platform: macOS
    sources:
      - path: macOS/Saver
      - path: macOS/RainNSView.swift
    dependencies:
      - package: BAVtrixCore
      - sdk: ScreenSaver.framework
    settings:
      base:
        PRODUCT_NAME: BAVtrix
        WRAPPER_EXTENSION: saver
        PRODUCT_BUNDLE_IDENTIFIER: dev.barkvestan.bavtrix.saver
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BAVtrix
        INFOPLIST_KEY_NSPrincipalClass: BAVtrixSaverView
        INFOPLIST_KEY_NSHumanReadableCopyright: "BArkVestan_Development"
        CODE_SIGNING_ALLOWED: NO
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES

  saver-snapshot:
    type: tool
    platform: macOS
    sources:
      - path: macOS/SaverTool
      - path: macOS/Saver
      - path: macOS/RainNSView.swift
    dependencies:
      - package: BAVtrixCore
      - sdk: ScreenSaver.framework
    settings:
      base:
        PRODUCT_NAME: saver-snapshot
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
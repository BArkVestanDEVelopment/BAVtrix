[package]
name = "bavtrix-setup"
version = "1.0.0"
edition = "2021"
authors = ["BArkVestan_Development"]
description = "Installer for BAVtrix"
license-file = "../LICENSE"
publish = false

[build-dependencies]
embed-resource = "2.5"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

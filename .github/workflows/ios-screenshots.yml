name: iOS store screenshots

# App Store screenshots from explicit simulators (6.9" and 6.5" iPhones). Manual run only.
on:
  workflow_dispatch:

jobs:
  screenshots:
    name: Screenshots on iPhone simulators
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple
        run: xcodegen generate

      # Debug build: the -debug* launch arguments used below only exist in Debug.
      - name: Build for the iOS Simulator
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild -project BAVtrix.xcodeproj -scheme BAVtrix-iOS \
            -sdk iphonesimulator -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | tail -n 40

      - name: Generate the store picture (own abstract artwork)
        run: swift apple/tools/make-store-picture.swift "$RUNNER_TEMP/store-picture.png"

      - name: Take the screenshots
        working-directory: apple
        run: |
          set -eo pipefail
          APP=build/Build/Products/Debug-iphonesimulator/BAVtrix.app
          BUNDLE=dev.barkvestan.bavtrix
          PIC="$RUNNER_TEMP/store-picture.png"
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable == true and (.identifier | test("iOS")))] | last | .identifier')
          echo "Runtime: $RUNTIME"
          echo "iPhone device types available:"
          xcrun simctl list devicetypes | grep -i "iPhone" || true

          # Creates a simulator from the first device type name that exists and prints its UDID.
          make_sim() {
            local label="$1"; shift
            local name type
            for name in "$@"; do
              type=$(xcrun simctl list devicetypes -j | jq -r --arg n "$name" '.devicetypes[] | select(.name == $n) | .identifier' | head -n 1)
              if [ -n "$type" ]; then
                echo "$label uses $name" >&2
                xcrun simctl create "BAV-$label" "$type" "$RUNTIME"
                return 0
              fi
            done
            echo "::warning::No simulator device type found for $label ($*)" >&2
            return 1
          }

          shoot() {
            local udid="$1" dir="$2"
            mkdir -p "$dir"
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$APP"
            run() { # <wait seconds> <file> <launch arguments...>
              local wait="$1" file="$2"; shift 2
              xcrun simctl terminate "$udid" "$BUNDLE" 2>/dev/null || true
              xcrun simctl launch "$udid" "$BUNDLE" "$@"
              sleep "$wait"
              xcrun simctl io "$udid" screenshot --type=png "$dir/$file"
            }
            run 14 1-rain.png -debugReset YES
            run 8  2-settings.png -debugReset YES -showSettings YES
            run 12 3-picture-copy.png -debugReset YES -debugPictureFile "$PIC" -debugBlend 0
            run 12 4-picture-or-blue.png -debugReset YES -debugPictureFile "$PIC" -debugBlend 1 -debugTheme Blue
            run 14 5-amber.png -debugReset YES -debugTheme Amber
            xcrun simctl shutdown "$udid" || true
            for f in "$dir"/*.png; do
              echo "$f: $(sips -g pixelWidth -g pixelHeight "$f" | tail -n 2 | tr '\n' ' ')"
            done
          }

          if U69=$(make_sim 6.9 "iPhone 17 Pro Max" "iPhone 16 Pro Max"); then
            shoot "$U69" shots/iphone-6.9
          fi
          if U65=$(make_sim 6.5 "iPhone 11 Pro Max" "iPhone XS Max"); then
            shoot "$U65" shots/iphone-6.5
          fi
          ls -R shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-store-screenshots
          path: |
            apple/shots
            apple/build.log

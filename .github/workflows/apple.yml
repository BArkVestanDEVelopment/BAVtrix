name: Apple

on:
  push:
    paths:
      - "apple/**"
      - ".github/workflows/apple.yml"
  workflow_dispatch:

jobs:
  core:
    name: Core tests
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        working-directory: apple/BAVtrixCore
        run: swift test

  ios:
    name: iOS build and simulator screenshots
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild -project BAVtrix.xcodeproj -scheme BAVtrix-iOS \
            -sdk iphonesimulator -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | tail -n 60

      - name: Run in the simulator and take screenshots
        working-directory: apple
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name | test("^iPhone"))][0].udid')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/BAVtrix.app
          mkdir -p shots
          xcrun simctl launch "$UDID" dev.barkvestan.bavtrix
          sleep 6
          # Video of the running rain (about 20 seconds), stopped cleanly so the file is finalized.
          xcrun simctl io "$UDID" recordVideo --codec h264 --force shots/rain.mp4 &
          REC=$!
          sleep 20
          xcrun simctl io "$UDID" screenshot shots/rain.png
          kill -INT $REC
          # Bounded wait: never block the job if the recorder does not exit.
          for i in $(seq 1 20); do kill -0 $REC 2>/dev/null || break; sleep 1; done
          kill -KILL $REC 2>/dev/null || true
          xcrun simctl terminate "$UDID" dev.barkvestan.bavtrix
          xcrun simctl launch "$UDID" dev.barkvestan.bavtrix -showSettings YES
          sleep 8
          xcrun simctl io "$UDID" screenshot shots/settings.png
          xcrun simctl terminate "$UDID" dev.barkvestan.bavtrix
          # The picture effect with a generated test picture, in each blend mode.
          xcrun simctl launch "$UDID" dev.barkvestan.bavtrix -debugPicture YES
          sleep 20
          xcrun simctl io "$UDID" screenshot shots/picture.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-results
          path: |
            apple/shots
            apple/build.log

  macos:
    name: macOS build and desktop screenshot
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Build the macOS app
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild -project BAVtrix.xcodeproj -scheme BAVtrix-macOS \
            -configuration Debug -derivedDataPath build-mac \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-mac.log | tail -n 60

      - name: Run it and take screenshots of the desktop
        working-directory: apple
        run: |
          mkdir -p shots-mac
          open build-mac/Build/Products/Debug/BAVtrix.app
          sleep 20
          screencapture -x shots-mac/desktop.png || true
          pkill -x BAVtrix || true
          sleep 2
          open build-mac/Build/Products/Debug/BAVtrix.app --args -showSettings
          sleep 10
          screencapture -x shots-mac/settings.png || true
          pkill -x BAVtrix || true

      - name: Build the screen saver and render its frames without a screen
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild -project BAVtrix.xcodeproj -scheme BAVtrix-Saver \
            -configuration Debug -derivedDataPath build-mac \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-saver.log | tail -n 40
          xcodebuild -project BAVtrix.xcodeproj -scheme saver-snapshot \
            -configuration Debug -derivedDataPath build-mac \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-snapshot.log | tail -n 40
          echo "--- saver bundle:"
          find build-mac/Build/Products/Debug/BAVtrix.saver -maxdepth 3 | head -n 30
          /usr/libexec/PlistBuddy -c "Print :NSPrincipalClass" build-mac/Build/Products/Debug/BAVtrix.saver/Contents/Info.plist
          mkdir -p shots-mac
          build-mac/Build/Products/Debug/saver-snapshot shots-mac
          ditto -c -k --keepParent build-mac/Build/Products/Debug/BAVtrix.saver shots-mac/BAVtrix-saver.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-results
          path: |
            apple/shots-mac
            apple/build-mac.log
            apple/build-saver.log
            apple/build-snapshot.log
